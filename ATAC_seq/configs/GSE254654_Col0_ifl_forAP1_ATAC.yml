# ATAC-seq: zwei biologische WT-Infloreszenzreplikate aus GSE254654.
# GSM8885678 -> SRX28235953 -> SRR32962275 (ifl_WT_forap1_rep1)
# GSM8885679 -> SRX28235954 -> SRR32962274 (ifl_WT_forap1_rep2)
# SRR-Zuordnung, ATAC-seq-Strategie und PAIRED-Layout über ENA geprüft.
# GEO: https://www.ncbi.nlm.nih.gov/geo/query/acc.cgi?acc=GSE254654
# Lokale Referenzpfade und Contignamen vor dem Lauf anpassen.

experiment_id: GSE254654_Col0_ifl_forAP1_ATAC
sample_id: Col0_ifl_forAP1_ATAC
layout: PE

metadata:
  geo_series: GSE254654
  geo_sample: "GSM8885678; GSM8885679"
  tissue: "inflorescence tips"
  genotype: Col-0
  age_or_stage: "inflorescences of 4-5-week-old plants"
  nuclei_isolation: crude
  sequencer: "Illumina NovaSeq 6000"
  publication: "Guo et al., Nucleic Acids Research (2025); doi:10.1093/nar/gkaf316"
  notes: >-
    Wild-type samples ifl_WT_forap1_rep1 and ifl_WT_forap1_rep2.
    Columbia-0 background according to the publication.
    Seeds were stratified at 4 C for two days on MS medium;
    inflorescences were collected from 4-5-week-old plants grown in soil
    under long-day conditions (16 h light at 23 C, 8 h darkness at 22 C).
    Bulk nuclei were extracted from inflorescence tips;
    no selection of a specific cell type is described.
    Libraries were sequenced paired-end with 150 bp reads.
    Intended as an accessibility reference for AP1-Flag/WT ChIP-seq
    from GSE254655 (GSM8885773 input; GSM8885774 and GSM8885775 IP).
    These ATAC samples are wild type, whereas the ChIP samples carry AP1-Flag.

reference:
  # Index mit Kerngenom UND Organellen verwenden.
  genome_index: /path/to/bowtie2_index/TAIR10_with_organelles
  genome_size: "1.2e8"
  mask_bed: /path/to/greenscreen_TAIR10.bed
  annotation_gtf: /path/to/Araport11.gtf
  # Alternativ annotation_gtf durch einen passenden tss_bed-Eintrag ersetzen.
  # tss_bed: /path/to/tss.bed
  # Optionale mask_bed-/annotation_gtf-Einträge entfernen, falls nicht verwendet.

params:
  # Namen am eigenen Index prüfen; hier die Ensembl-Namen des Templates.
  # Bei TAIR-Namen: Chr1..Chr5 und ChrM/ChrC entsprechend einsetzen.
  keep_chroms: ["1", "2", "3", "4", "5"]
  organelle_chroms: ["Mt", "Pt"]
  threads: 6
  subsample_fragments: 10000000
  run_fingerprint: true
  fingerprint_timeout: 3600
  run_ataqv: true

# Optional: nach den ersten echten Läufen passend kalibrieren.
# qc_thresholds:
#   usable_fragments: {good_min: 8000000, ok_min: 4000000}
#   tss_enrichment: {good_min: 6.0, ok_min: 4.0}

save:
  filtered_bam: false
  cutsite_bigwig: true

replicates:
  - rep_id: rep1
    sample:
      source: sra
      accession: SRR32962275
  - rep_id: rep2
    sample:
      source: sra
      accession: SRR32962274
